[package]
name = "uclip-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "uclip"
path = "src/main.rs"

[dependencies]
uclip-core = { path = "../uclip-core" }
uclip-runtime = { path = "../uclip-runtime" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde.workspace = true
base64 = "=0.23.1"
serde_json.workspace = true
rmp-serde = "=1.3.1"
serde_bytes = "=0.11.19"
tokio = { workspace = true, features = ["signal", "time"] }
uuid = { version = "=1.29.2", features = ["v4"] }

[build-dependencies]
static_vcruntime = "=3.0.0"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.59.0", features = ["Win32_Globalization"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSLocale", "NSString"] }
