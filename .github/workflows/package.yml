name: Build installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf libfuse2
      - run: npm ci
      - run: npm run check
      - run: npm run package
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: uclip-${{ matrix.os }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
