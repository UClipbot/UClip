[workspace]
members = ["crates/uclip-core", "crates/uclip-runtime", "crates/uclip-cli", "src-tauri"]
default-members = ["crates/uclip-core"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.93"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["sync", "rt", "macros"] }
ts-rs = { version = "=12.0.1", features = ["serde-compat"] }

[patch.crates-io]
# Backport X11 ungrab flushing for the plugin's 0.8 dependency.
# https://github.com/tauri-apps/global-hotkey/pull/197
global-hotkey = { git = "https://github.com/tauri-apps/global-hotkey.git", rev = "11b352c5b77d6cd03fddc97bb951586f4d8fd927" }

[profile.dev]
debug = 0

[profile.test]
debug = 0
