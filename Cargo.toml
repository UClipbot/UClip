[workspace]
members = ["crates/uclip-core", "src-tauri"]
default-members = ["crates/uclip-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["sync", "rt", "macros"] }
ts-rs = { version = "=12.0.1", features = ["serde-compat"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0
