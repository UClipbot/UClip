[package]
name = "uclip-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "uclip_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
uclip-core = { path = "../crates/uclip-core" }
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-runtime = "=2.12.2"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-global-shortcut = "=2.4.1"
serde.workspace = true
serde_json.workspace = true
url = "2"
clipboard-rs = "=0.3.5"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "tiff"] }
base64 = "=0.23.1"
uuid = { version = "=1.29.2", features = ["v4"] }
tokio = { workspace = true, features = ["time"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
x11rb = { version = "=0.13.2", features = ["xfixes", "xtest", "res"] }
raw-window-handle = "=0.6.2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "=2.7.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.59.0", features = ["Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSPasteboard", "NSPasteboardItem", "NSWorkspace", "NSRunningApplication", "NSWindow", "NSButton", "NSControl", "NSView"] }

objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", features = ["NSArray", "NSData", "NSString"] }

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
