[package]
name = "uclip-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "uclip_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
uclip-core = { path = "../crates/uclip-core" }
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-single-instance = "=2.5.5"
serde.workspace = true
serde_json.workspace = true
url = "2"
clipboard-rs = "=0.3.5"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
base64 = "=0.23.1"
uuid = { version = "=1.29.2", features = ["v4"] }
tokio.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "=0.13.2", features = ["xfixes", "xtest"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.59.0", features = ["Win32_System_DataExchange"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSPasteboard"] }

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
